const lerp = (a, b, t) => a + (b - a) * t;

const roll = ai => ai > 0 && rint(1, 20) <= ai;

/* ============================ ACTIONS ============================ */
function canAct(){ return state === 'play' && !paused && S && !S.po.active; }
function toggleDoor(side){

/* ============================ GAME LOGIC ============================ */
function jumpscare(who){

  state = 'jumpscare'; jumpWho = who; jumpT = 0; S.mon.open = false; sfx('jump'); quip = pick(QUIPS_DEAD);
}
function startPowerOut(){
  const p = S.po; p.active = true; p.phase = 0; p.timer = rr2(CONFIG.powerOut.darkWait);
  S.doorL.closed = false; S.doorR.closed = false; S.light = null; S.mon.open = false; S.mask.on = false;
  S.J.disabled = true; S.L.disabled = true; S.C.disabled = true; S.C.state = 'litter'; S.C.stage = 0; sfx('powerDown');

function enterRoomCreeper(room){
  const J = S.J, old = J.loc; J.loc = room; J.prev = old;
  if (room === 'ldoor' || room === 'rdoor') { J.doorTimer = rr2(CONFIG.creeper.attackWindow) * CONFIG.creeper.windowScale[night - 1]; J.seen = false; sfx('step', 0.4); }
  else if (['whall', 'ehall', 'wcorner', 'ecorner'].includes(room)) sfx('step', 0.18);
  if (S.mon.open && (S.mon.cam === old || S.mon.cam === room)) S.mon.fx = 0.3;
}
// Picks the next retreat room: strictly farther from the blocked door, never the room just left,
// and avoids dead ends (e.g. the closet) when other options exist.
function retreatNext(X, fromDoor, allowVirtual){
  const dist = DIST[fromDoor];
  let far = ROOMS[X.loc].adj.filter(r => (allowVirtual || !ROOMS[r].virtual) && dist[r] > dist[X.loc] && r !== X.prev);
  const open = far.filter(r => ROOMS[r].adj.length > 1); if (open.length) far = open;

}
function creeperMove(){
  const J = S.J; if (J.loc === 'ldoor' || J.loc === 'rdoor' || J.cool > 0 || J.retreating > 0) return;
  if (J.loc === 'stage' || J.loc === 'dining') J.target = pickSide(J, CONFIG.creeper);
  const dist = DIST[J.target === 'L' ? 'ldoor' : 'rdoor'], adj = ROOMS[J.loc].adj;
  const closer = avoidBack(J, adj.filter(r => dist[r] < dist[J.loc]));
  let next = (closer.length && Math.random() < CONFIG.creeper.towardDoor) ? pick(closer) : pick(avoidBack(J, adj));

function update(dt){

  // animations
  const dsp = CONFIG.doorSpeed * dt;
  S.doorL.amt = clamp(S.doorL.amt + (S.doorL.closed ? dsp : -dsp), 0, 1);
  S.doorR.amt = clamp(S.doorR.amt + (S.doorR.closed ? dsp : -dsp), 0, 1);
  S.mask.amt = clamp(S.mask.amt + (S.mask.on ? 1 : -1) * CONFIG.maskSpeed * dt, 0, 1);
  S.mon.amt = clamp(S.mon.amt + (S.mon.open ? 1 : -1) * CONFIG.monSpeed * dt, 0, 1);
  if (S.mon.fx > 0) S.mon.fx -= dt;
  if (S.flash > 0) S.flash -= dt;
  // view
  const camUp = S.lookUp || keys['w'] || keys['arrowup'] || (ptr.type === 'mouse' && ptr.has && ptr.y < 70 && !S.mon.open);
  S.camY = lerp(S.camY, camUp ? 0 : 260, Math.min(1, dt * 9));
  if (ptr.type === 'mouse' && ptr.has && !S.mon.open) {
    if (ptr.x < 230) S.camX -= (230 - ptr.x) * 3.2 * dt; else if (ptr.x > 730) S.camX += (ptr.x - 730) * 3.2 * dt;
  }
  if (keys['arrowleft']) S.camX -= 380 * dt; if (keys['arrowright']) S.camX += 380 * dt;
  S.camX = clamp(S.camX, 0, 540);

  // power
  S.usage = 1 + (S.doorL.closed ? 1 : 0) + (S.doorR.closed ? 1 : 0) + (S.light ? 1 : 0) + (S.mon.open ? 1 : 0);
  if (!S.po.active) {
    S.power -= CONFIG.power.drainPerUsagePerSec * S.usage * CONFIG.power.nightMult[night - 1] * dt;
    if (S.power <= 0) { S.power = 0; startPowerOut(); }
  }

  // ---------- Creeper Guloso ----------
  const J = S.J;
  if (!J.disabled) {
    if (J.cool > 0) J.cool -= dt;
    if (J.retreating > 0) {
      J.hop -= dt;
      if (J.hop <= 0) {
        const nx = retreatNext(J, J.retreatFrom, false);
        if (nx) { enterRoomCreeper(nx); J.retreating--; J.hop = rr2(CONFIG.creeper.retreatHop); } else J.retreating = 0;
        if (J.retreating <= 0) J.cool = rr2(CONFIG.creeper.retreatCool);
      }
    }
    const ja = aiOf('creeper');
    J.tick -= dt; while (J.tick <= 0) { J.tick += CONFIG.creeper.interval; if (roll(ja)) creeperMove(); }
    if (J.loc === 'ldoor' || J.loc === 'rdoor') {
      const side = J.loc === 'ldoor' ? 'L' : 'R', door = side === 'L' ? S.doorL : S.doorR;
      if (S.light === side && !door.closed && !J.seen) { J.seen = true; sfx('stinger'); }
      J.doorTimer -= dt;
      if (J.doorTimer <= 0) {
        if (door.closed && door.amt > 0.8) { // blocked: walk back through several rooms, then cool down
          sfx('bang'); J.prev = J.loc; J.loc = side === 'L' ? 'wcorner' : 'ecorner'; J.seen = false; if (S.mon.open) S.mon.fx = 0.3;
          J.lastBlocked = side; J.retreatFrom = side === 'L' ? 'ldoor' : 'rdoor'; J.retreating = rint(CONFIG.creeper.retreatSteps[0], CONFIG.creeper.retreatSteps[1]); J.hop = rr2(CONFIG.creeper.retreatHop); J.cool = 0; }
        else { jumpscare('creeper'); return; }
      }
    }
  }

      if (C.stage < 3) {

        C.tick -= dt;
        while (C.tick <= 0) {
          C.tick += K.interval;

      }
    }
  }

  // ---------- Marshy ----------
  const M = S.M;
  if (!S.po.active) {
    if (M.cool > 0) M.cool -= dt;
    if (M.retreating > 0 && !(S.mon.open && S.mon.amt > 0.5 && S.mon.cam === M.loc)) { // still frozen while watched
      M.hop -= dt;
      if (M.hop <= 0) {
        const nx = retreatNext(M, M.retreatFrom, false);
        if (nx) { const old = M.loc; M.loc = nx; M.prev = old; M.retreating--; M.hop = rr2(CONFIG.marshy.retreatHop); if (S.mon.open && (S.mon.cam === old || S.mon.cam === nx)) S.mon.fx = 0.3; } else M.retreating = 0;
        if (M.retreating <= 0) M.cool = rr2(CONFIG.marshy.retreatCool);
      }
    }
    const ma = aiOf('marshy');
    M.tick -= dt; while (M.tick <= 0) { M.tick += CONFIG.marshy.interval; if (roll(ma)) marshyMove(); }
    if (M.atCorner) {
      const door = M.atCorner === 'L' ? S.doorL : S.doorR;

    } else if (L.state === 'entering') {

  c.fillStyle = 'rgba(0,0,0,0.45)'; c.fillRect(0, 0, W, H);

  txt('FIVE NIGHTS', 60, 120, 64, 'rgba(255,255,255,' + fl + ')', 'left', true); txt("AT MARSHY'S", 60, 190, 64, 'rgba(255,255,255,' + fl + ')', 'left', true);
  txt('a satirical fan parody — not affiliated with any real person', 62, 222, 14, '#888', 'left');
  button(60, 270, 260, 44, 'NEW GAME', () => { startNight(1); });
  button(60, 326, 260, 44, 'CONTINUE  (Night ' + save.unlocked + ')', () => { startNight(save.unlocked); }, { size: 16, disabled: save.unlocked <= 1 });
  button(60, 382, 260, 44, 'NIGHT SELECT', () => { state = 'select'; });
  txt('Space: monitor · M: mask · Q/A: left door/light · E/D: right door/light · W/↑: look up · ←/→: pan', 60, 500, 13, '#777', 'left');
  txt('Touch: drag to look around, tap buttons on the walls', 60, 520, 13, '#777', 'left');
  drawVig(0.8);
}
function renderSelect(){
  drawStaticBG(0.08); txt('NIGHT SELECT', W / 2, 110, 44, '#fff', 'center', true);
  for (let i = 1; i <= 5; i++) button(130 + (i - 1) * 140, 200, 120, 90, i + '', () => startNight(i), { size: 40, disabled: i > save.unlocked });
  txt(save.completed ? 'All five nights survived.' : 'Survive a night to unlock the next.', W / 2, 340, 16, '#999', 'center');
  button(W / 2 - 80, 420, 160, 40, 'BACK', () => { state = 'menu'; });
}
function renderIntro(){
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H); drawNoise(0.04);
  const a = clamp(introT < 0.6 ? introT / 0.6 : introT > 3.6 ? (4.2 - introT) / 0.6 : 1, 0, 1);
  c.globalAlpha = a; txt('12:00 AM', W / 2, 220, 64, '#fff', 'center', true); txt('Night ' + night, W / 2, 275, 34, '#ddd', 'center', true);
  wrapText(TIPS[night - 1], W / 2, 340, 720, 19, '#aaa'); c.globalAlpha = 1; txt('tap to skip', W / 2, 520, 12, '#555', 'center');
  UI.push({ x: 0, y: 0, w: W, h: H, fn: () => { introT = 99; } });
}
function wrapText(s, x, y, maxW, lh, col){
  c.font = '17px ' + FONT; const words = s.split(' '); let line = '';
  words.forEach(w => { const t = line + w + ' '; if (c.measureText(t).width > maxW && line) { txt(line, x, y, 17, col, 'center'); line = w + ' '; y += lh + 3; } else line = t; });
  txt(line, x, y, 17, col, 'center');
}
function renderPlay(){
  drawOffice(); drawLawyerEnter(); drawMaskOverlay(); drawCamView(); drawHUD();
  if (paused) {
    c.fillStyle = 'rgba(0,0,0,0.7)'; c.fillRect(0, 0, W, H); UI.length = 0; txt('PAUSED', W / 2, 200, 48, '#fff', 'center', true);
    button(W / 2 - 110, 240, 220, 44, 'RESUME', () => { paused = false; }); button(W / 2 - 110, 296, 220, 44, 'QUIT TO MENU', () => { state = 'menu'; paused = false; });
  }
}
function renderJump(){
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  const k = Math.min(1, jumpT / 0.25), sc = 1.6 + k * 1.4, sh = 14 * (1 - Math.min(1, jumpT / 1.6));
  c.save(); c.translate(W / 2 + rnd(-sh, sh), rnd(-sh, sh));
  if (jumpWho === 'marshy') drawChar('marshy', 0, H + 200 * (sc - 1.6), sc, 1);
  else if (jumpWho === 'creeper') drawChar('creeper', 0, H + 250 + 30 * k, sc * 0.92, 1);
  else if (jumpWho === 'snep') drawChar('snep', 0, H + 130 + 30 * k, sc * 0.78, 1);
  else drawChar('lawyer', 0, H + 220 * (sc - 1.3), sc, 1);
  c.restore();
  if (Math.sin(jumpT * 60) > 0) { c.fillStyle = 'rgba(255,255,255,0.12)'; c.fillRect(0, 0, W, H); }
  drawNoise(0.15);
}
function renderGameOver(){
  drawStaticBG(0.35 + 0.1 * Math.sin(goT * 15));
  txt('GAME OVER', W / 2, 200, 64, '#d22', 'center', true);
  const who = CONFIG.names[jumpWho];
  txt('Caught by ' + who, W / 2, 245, 20, '#ccc', 'center'); txt(quip, W / 2, 280, 18, '#888', 'center');
  if (goT > 1) { button(W / 2 - 230, 340, 220, 46, 'TRY AGAIN', () => startNight(night)); button(W / 2 + 10, 340, 220, 46, 'MAIN MENU', () => { state = 'menu'; }); }
}
function renderWin(){
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  const t = winT, shift = clamp((t - 1) / 1.2, 0, 1), e = shift * shift * (3 - 2 * shift);
  c.save(); c.beginPath(); c.rect(0, 190, W, 90); c.clip();
  txt('5 AM', W / 2, 262 - e * 100, 72, '#fff', 'center', true); txt('6 AM', W / 2, 362 - e * 100, 72, '#fff', 'center', true); c.restore();
  if (t > 3) txt(quip, W / 2, 360, 18, '#999', 'center');
  if (t > 6.5) state = 'nightdone';
}
function renderNightDone(){
  drawStaticBG(0.05); txt('Night ' + night + ' complete', W / 2, 190, 48, '#fff', 'center', true); txt(quip, W / 2, 230, 18, '#999', 'center');
  if (night < 5) button(W / 2 - 130, 300, 260, 46, 'NEXT NIGHT', () => startNight(night + 1));
  else button(W / 2 - 130, 300, 260, 46, 'CONTINUE', () => { state = 'ending'; });
  button(W / 2 - 130, 358, 260, 46, 'MAIN MENU', () => { state = 'menu'; });
}
function renderEnding(){
  drawStaticBG(0.06); txt('YOU SURVIVED ALL FIVE NIGHTS', W / 2, 190, 36, '#fff', 'center', true);
  wrapText('The news cycle moved on. The lawyer sent an invoice. Marshy posted an apology video with the comments turned off.', W / 2, 250, 700, 19, '#aaa');
  button(W / 2 - 110, 340, 220, 46, 'MAIN MENU', () => { state = 'menu'; });
}

function render(){
  UI.length = 0; c.clearRect(0, 0, W, H);
  switch (state) {
    case 'menu': renderMenu(); break; case 'select': renderSelect(); break; case 'intro': renderIntro(); break;
    case 'play': renderPlay(); break; case 'jumpscare': renderJump(); break; case 'gameover': renderGameOver(); break;
    case 'win': renderWin(); break; case 'nightdone': renderNightDone(); break; case 'ending': renderEnding(); break;
  }
}
function step(dt){
  tAll += dt;
  if (state === 'intro') { introT += dt; if (introT > 4.2) { state = 'play'; } }
  else if (state === 'play') { if (!paused) update(dt); }
  else if (state === 'jumpscare') { jumpT += dt; if (jumpT > 1.7) { state = 'gameover'; goT = 0; } }
  else if (state === 'gameover') goT += dt;
  else if (state === 'win') winT += dt;
  audioScene();
}

/* ============================ INPUT ============================ */
function toCanvas(e){ const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
function worldTap(x, y){
  if (!canAct() || S.mon.open || S.mask.on) return;
  const wx = x + S.camX, wy = y + S.camY, hit = b => wx >= b[0] && wx <= b[0] + b[2] && wy >= b[1] && wy <= b[1] + b[3];
  if (hit(BT.lL)) toggleLight('L'); else if (hit(BT.dL)) toggleDoor('L'); else if (hit(BT.lR)) toggleLight('R'); else if (hit(BT.dR)) toggleDoor('R');
}
function tap(x, y){
  for (let i = UI.length - 1; i >= 0; i--) { const u = UI[i]; if (x >= u.x && x <= u.x + u.w && y >= u.y && y <= u.y + u.h) { u.fn(); return; } }
  if (state === 'play' && !paused) worldTap(x, y);
}
cv.addEventListener('pointerdown', e => {
  auInit(); const p = toCanvas(e); ptr.x = p.x; ptr.y = p.y; ptr.sx = p.x; ptr.sy = p.y; ptr.lx = p.x; ptr.down = true; ptr.moved = false; ptr.type = e.pointerType || 'mouse';
  try { cv.setPointerCapture(e.pointerId); } catch (err) {} e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  const p = toCanvas(e); ptr.type = e.pointerType || 'mouse'; ptr.has = true;
  if (ptr.down && ptr.type !== 'mouse') {
    if (Math.abs(p.x - ptr.sx) > 10 || Math.abs(p.y - ptr.sy) > 10) ptr.moved = true;
    if (ptr.moved && state === 'play' && S && !S.mon.open) S.camX = clamp(S.camX - (p.x - ptr.lx), 0, 540);
  }
  ptr.x = p.x; ptr.y = p.y; ptr.lx = p.x;
});
cv.addEventListener('pointerup', e => { const p = toCanvas(e); ptr.x = p.x; ptr.y = p.y; if (ptr.down && !ptr.moved) tap(p.x, p.y); ptr.down = false; });
cv.addEventListener('pointercancel', () => { ptr.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  auInit(); const k = e.key.toLowerCase(); if (keys[k]) return; keys[k] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  if (state === 'play') {
    if (k === 'escape' || k === 'p') paused = !paused;
    else if (k === ' ') toggleMon(); else if (k === 'm') toggleMask();
    else if (k === 'q') toggleDoor('L'); else if (k === 'a') toggleLight('L'); else if (k === 'e') toggleDoor('R'); else if (k === 'd') toggleLight('R');
    else if (k === 'l') { if (S.mon.open) selectCam('litter'); }
    else if (k === '1' || k === '2' || k === '3' || k === '4' || k === '5' || k === '6' || k === '7' || k === '8' || k === '9') { if (S.mon.open) selectCam(CAM_ORDER[+k - 1]); }
  } else if (state === 'intro' && (k === ' ' || k === 'enter')) introT = 99;
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

/* ============================ LOOP ============================ */
let last = 0;
function frame(ts){
  const dt = Math.min(0.1, (ts - last) / 1000 || 0); last = ts;
  try { step(dt); render(); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
window.__FNAM = { isActive, drawCamView, step, render, startNight, jumpscare, get S(){ return S; }, get state(){ return state; }, set state(v){ state = v; }, CONFIG, tap, keys, ptr, selectCam, toggleDoor, toggleLight, toggleMon, toggleMask, ROOMS, get night(){ return night; } };
requestAnimationFrame(frame);
})();
</script>
