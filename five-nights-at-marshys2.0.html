const AU = { ctx: null, master: null, g: {}, nb: null };

    const nb = a.createBuffer(1, a.sampleRate * 2, a.sampleRate); const d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

}
function noise(dur, vol, f = 1000, type = 'lowpass', delay = 0, q = 1){
  const a = AU.ctx; if (!a) return; const t0 = a.currentTime + delay;
  const s = a.createBufferSource(); s.buffer = AU.nb; const fl = a.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  const g = a.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0005, t0 + dur);

function startPowerOut(){

function enterRoomJason(room){
  const J = S.J, old = J.loc; J.loc = room; J.prev = old;
  if (room === 'ldoor' || room === 'rdoor') { J.doorTimer = rr2(CONFIG.jason.attackWindow) * CONFIG.jason.windowScale[night - 1]; J.seen = false; sfx('step', 0.4); }
  else if (['whall', 'ehall', 'wcorner', 'ecorner'].includes(room)) sfx('step', 0.18);
  if (S.mon.open && (S.mon.cam === old || S.mon.cam === room)) S.mon.fx = 0.3;
}
// Picks the next retreat room: strictly farther from the blocked door, never the room just left,
// and avoids dead ends (e.g. the closet) when other options exist.
function retreatNext(X, fromDoor, allowVirtual){
  const dist = DIST[fromDoor];
  let far = ROOMS[X.loc].adj.filter(r => (allowVirtual || !ROOMS[r].virtual) && dist[r] > dist[X.loc] && r !== X.prev);
  const open = far.filter(r => ROOMS[r].adj.length > 1); if (open.length) far = open;
  return far.length ? pick(far) : null;
}
function avoidBack(X, list){ const f = list.filter(r => r !== X.prev); return f.length ? f : list; }
function pickSide(X, cfg){
  const other = X.lastBlocked === 'L' ? 'R' : 'L';
  if (X.lastBlocked && Math.random() < cfg.switchSideChance) return other;
  return Math.random() < 0.5 ? 'L' : 'R';
}
function jasonMove(){
  const J = S.J; if (J.loc === 'ldoor' || J.loc === 'rdoor' || J.cool > 0 || J.retreating > 0) return;
  if (J.loc === 'stage' || J.loc === 'dining') J.target = pickSide(J, CONFIG.jason);
  const dist = DIST[J.target === 'L' ? 'ldoor' : 'rdoor'], adj = ROOMS[J.loc].adj;
  const closer = avoidBack(J, adj.filter(r => dist[r] < dist[J.loc]));
  let next = (closer.length && Math.random() < CONFIG.jason.towardDoor) ? pick(closer) : pick(avoidBack(J, adj));
  if ((next === 'ldoor' && J.target !== 'L') || (next === 'rdoor' && J.target !== 'R')) next = J.loc;
  if (next !== J.loc) enterRoomJason(next);
}
function marshyMove(){
  const M = S.M; if (M.atCorner || M.cool > 0 || M.retreating > 0) return;
  if (S.mon.open && S.mon.amt > 0.5 && S.mon.cam === M.loc) return; // frozen while watched
  if (M.loc === 'stage' || M.loc === 'dining') M.target = (M.lastBlocked && Math.random() < CONFIG.marshy.switchSideChance) ? (M.lastBlocked === 'L' ? 'R' : 'L') : (Math.random() < 0.55 ? 'R' : 'L');
  const tgt = M.target === 'L' ? 'wcorner' : 'ecorner', dist = DIST[tgt];
  const adj = ROOMS[M.loc].adj.filter(r => !ROOMS[r].virtual);
  const closer = avoidBack(M, adj.filter(r => dist[r] < dist[M.loc]));
  const next = (closer.length && Math.random() < CONFIG.marshy.towardDoor) ? pick(closer) : pick(avoidBack(M, adj));
  const old = M.loc; M.loc = next; M.prev = old;
  if (S.mon.open && (S.mon.cam === old || S.mon.cam === next)) S.mon.fx = 0.3;
  if (next === tgt) { M.atCorner = M.target; M.attackTimer = rr2(CONFIG.marshy.attackDelay); M.closedTimer = 0; M.closedLimit = rr2(CONFIG.marshy.closedWait); }
}

function update(dt){
  S.t += dt;
  const hs = CONFIG.hourSeconds;
  // animations
  const dsp = CONFIG.doorSpeed * dt;
  S.doorL.amt = clamp(S.doorL.amt + (S.doorL.closed ? dsp : -dsp), 0, 1);
  S.doorR.amt = clamp(S.doorR.amt + (S.doorR.closed ? dsp : -dsp), 0, 1);
  S.mask.amt = clamp(S.mask.amt + (S.mask.on ? 1 : -1) * CONFIG.maskSpeed * dt, 0, 1);
  S.mon.amt = clamp(S.mon.amt + (S.mon.open ? 1 : -1) * CONFIG.monSpeed * dt, 0, 1);
  if (S.mon.fx > 0) S.mon.fx -= dt;
  if (S.flash > 0) S.flash -= dt;
  // view
  const camUp = S.lookUp || keys['w'] || keys['arrowup'] || (ptr.type === 'mouse' && ptr.has && ptr.y < 70 && !S.mon.open);
  S.camY = lerp(S.camY, camUp ? 0 : 260, Math.min(1, dt * 9));
  if (ptr.type === 'mouse' && ptr.has && !S.mon.open) {
    if (ptr.x < 230) S.camX -= (230 - ptr.x) * 3.2 * dt; else if (ptr.x > 730) S.camX += (ptr.x - 730) * 3.2 * dt;
  }
  if (keys['arrowleft']) S.camX -= 380 * dt; if (keys['arrowright']) S.camX += 380 * dt;
  S.camX = clamp(S.camX, 0, 540);

  // power
  S.usage = 1 + (S.doorL.closed ? 1 : 0) + (S.doorR.closed ? 1 : 0) + (S.light ? 1 : 0) + (S.mon.open ? 1 : 0);
  if (!S.po.active) {
    S.power -= CONFIG.power.drainPerUsagePerSec * S.usage * CONFIG.power.nightMult[night - 1] * dt;
    if (S.power <= 0) { S.power = 0; startPowerOut(); }
  }

  // ---------- Jason ----------
  const J = S.J;
  if (!J.disabled) {
    if (J.cool > 0) J.cool -= dt;
    if (J.retreating > 0) {
      J.hop -= dt;
      if (J.hop <= 0) {
        const nx = retreatNext(J, J.retreatFrom, false);
        if (nx) { enterRoomJason(nx); J.retreating--; J.hop = rr2(CONFIG.jason.retreatHop); } else J.retreating = 0;
        if (J.retreating <= 0) J.cool = rr2(CONFIG.jason.retreatCool);
      }
    }
    const ja = aiOf('jason');
    J.tick -= dt; while (J.tick <= 0) { J.tick += CONFIG.jason.interval; if (roll(ja)) jasonMove(); }
    if (J.loc === 'ldoor' || J.loc === 'rdoor') {
      const side = J.loc === 'ldoor' ? 'L' : 'R', door = side === 'L' ? S.doorL : S.doorR;
      if (S.light === side && !door.closed && !J.seen) { J.seen = true; sfx('stinger'); }
      J.doorTimer -= dt;
      if (J.doorTimer <= 0) {
        if (door.closed && door.amt > 0.8) { // blocked: walk back through several rooms, then cool down
          sfx('bang'); J.prev = J.loc; J.loc = side === 'L' ? 'wcorner' : 'ecorner'; J.seen = false; if (S.mon.open) S.mon.fx = 0.3;
          J.lastBlocked = side; J.retreatFrom = side === 'L' ? 'ldoor' : 'rdoor'; J.retreating = rint(CONFIG.jason.retreatSteps[0], CONFIG.jason.retreatSteps[1]); J.hop = rr2(CONFIG.jason.retreatHop); J.cool = 0; }
        else { jumpscare('jason'); return; }
      }
    }
  }

  // ---------- Marshy ----------
  const M = S.M;
  if (!S.po.active) {
    if (M.cool > 0) M.cool -= dt;
    if (M.retreating > 0 && !(S.mon.open && S.mon.amt > 0.5 && S.mon.cam === M.loc)) { // still frozen while watched
      M.hop -= dt;
      if (M.hop <= 0) {
        const nx = retreatNext(M, M.retreatFrom, false);
        if (nx) { const old = M.loc; M.loc = nx; M.prev = old; M.retreating--; M.hop = rr2(CONFIG.marshy.retreatHop); if (S.mon.open && (S.mon.cam === old || S.mon.cam === nx)) S.mon.fx = 0.3; } else M.retreating = 0;
        if (M.retreating <= 0) M.cool = rr2(CONFIG.marshy.retreatCool);
      }
    }
    const ma = aiOf('marshy');
    M.tick -= dt; while (M.tick <= 0) { M.tick += CONFIG.marshy.interval; if (roll(ma)) marshyMove(); }
    if (M.atCorner) {
      const door = M.atCorner === 'L' ? S.doorL : S.doorR;
      if (!S.mon.open) {
        if (!door.closed) { M.attackTimer -= dt; if (M.attackTimer <= 0) { jumpscare('marshy'); return; } }
        else { M.closedTimer += dt; if (M.closedTimer >= M.closedLimit) { // blocked: walk back through several rooms, then cool down

          M.retreating = rint(CONFIG.marshy.retreatSteps[0], CONFIG.marshy.retreatSteps[1]); M.hop = rr2(CONFIG.marshy.retreatHop); sfx('bang'); } }
      }
    }
  }

    } else if (L.state === 'duct') {
      L.timer -= dt;
      if (L.timer <= 0) { L.state = 'vent'; L.timer = CONFIG.lawyer.ventStay[night - 1]; sfx('clank'); }
    } else if (L.state === 'vent') {
      L.timer -= dt;
      if (L.timer <= 0) { L.state = 'entering'; L.grace = CONFIG.lawyer.enterGrace; S.mon.open = false; S.flash = 0.15; sfx('stinger'); }
    } else if (L.state === 'entering') {
      if (S.mask.on && S.mask.amt >= 0.8) { L.state = 'lair'; L.cool = rr2(CONFIG.lawyer.repelCool); L.tick = CONFIG.lawyer.interval; sfx('repel'); }
      else { L.grace -= dt; if (L.grace <= 0) { jumpscare('lawyer'); return; } }

  const po = S.po;
  if (po.active) {
    po.timer -= dt;
    if (po.timer <= 0) {
      if (po.phase === 0) { po.phase = 1; po.timer = sfxDur(); }
      else if (po.phase === 1) { po.phase = 2; po.timer = rr2(CONFIG.powerOut.blackout); }

}

}

    else if (k === '1' || k === '2' || k === '3' || k === '4' || k === '5' || k === '6' || k === '7' || k === '8' || k === '9') { if (S.mon.open) selectCam(CAM_ORDER[+k - 1]); }
